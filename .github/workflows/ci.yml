name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 为什么每条 swift 命令都带 --disable-sandbox：
# SwiftPM 编译 manifest 时会自己套一层 sandbox-exec。在受限环境里（本地评审沙箱、
# 部分容器）这层嵌套会直接 `sandbox_apply: Operation not permitted`，报的却是
# 「Invalid manifest」，看起来像 Package.swift 写错了。关掉它对产物没有任何影响，
# 好处是「本地验证过的命令」和「CI 跑的」逐字相同。
env:
  SWIFT_FLAGS: --disable-sandbox

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # 之前这条流水线一条单测都没有，零 warning 成了唯一的门禁——它只能证明
      # 「编译过」，证明不了「命令行条件被正确翻译成 Filter」。后者出错不会崩，
      # 只会安静地查错数据，所以把纯逻辑单独锁住。
      - name: swift test
        run: |
          set -o pipefail
          swift test $SWIFT_FLAGS 2>&1 | tee /tmp/test.log

      - name: 测试代码同样零 warning
        run: |
          if grep -E '\.swift:[0-9]+:[0-9]+: (warning|error):' /tmp/test.log; then
            echo "::error::测试代码出现 warning/error，见上方输出"
            exit 1
          fi

  build:
    # 必须是 macOS 26 镜像：Package.swift 声明 platforms: [.macOS("26.0")]，
    # 低版本 SDK 连 Liquid Glass 的符号都不认识，编译直接失败。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version | head -2

      # 零 warning 是本仓库的硬要求（见 CONTRIBUTING.md）。
      # 只匹配「文件:行:列: warning:」，不匹配编译输出里偶尔出现的其它字样。
      # 注意：本地增量构建会跳过未改动的文件，warning 可能只在新克隆/新 runner 上出现——
      # 验证「零 warning」必须用干净构建（swift build --scratch-path /tmp/x），
      # 否则会像 2026-10-31 那次一样，本地绿、CI 红。
      - name: build (debug, 零 warning)
        run: |
          set -o pipefail
          swift build $SWIFT_FLAGS 2>&1 | tee /tmp/build.log
          if grep -E '\.swift:[0-9]+:[0-9]+: (warning|error):' /tmp/build.log; then
            echo "::error::构建出现 warning/error，见上方输出"
            exit 1
          fi

      # 这里必须带 pipefail：原来写 `swift build -c release 2>&1 | tail -5`，
      # 管道末尾是 tail，release 构建失败也会返回 0，等于这条门禁从来没有生效。
      - name: build (release)
        run: |
          set -o pipefail
          swift build -c release $SWIFT_FLAGS 2>&1 | tail -5

      - name: 平台约束没被放宽
        run: |
          grep -q 'swift-tools-version: 6.2' Package.swift \
            || { echo "::error::swift-tools-version 已不是 6.2"; exit 1; }
          grep -q "platforms: \[.macOS(\"26.0\")\]" Package.swift \
            || { echo "::error::Package.swift 的 platforms 已不是 macOS 26"; exit 1; }
          test -x .build/debug/mstore-db
          echo "ok: $(du -h .build/debug/mstore-db | cut -f1)"

      # 打包脚本是发布路径上唯一「没人手工走过就上生产」的地方。每次 CI 都跑一遍
      # 单架构版本，保证 Info.plist 模板、图标、ad-hoc 签名三者没有一处腐烂。
      - name: 打包冒烟（单架构，快）
        env:
          ARCHS: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
          VERSION: 0.0.0-ci
        run: |
          ./tools/bundle.sh
          codesign --verify --strict dist/mstore-db.app
          plutil -lint dist/mstore-db.app/Contents/Info.plist

  # 客户端与内核之间只有协议。CI 起不了窗口，但可以证明
  # 「内核能起来 + 握手 + 位图查询 + biz.get」这套帧的形状没变。
  protocol:
    runs-on: macos-26
    steps:
      - name: checkout mstore-db
        uses: actions/checkout@v4
        with:
          path: mstore-db

      # 刻意跟 mstore 的 main，不 pin。这个 job 存在的意义就是「上游一改，这里立刻知道」；
      # pin 到某个 tag 会让契约测试永远测一份冻住的旧内核，等于没测。
      # 上游真有不兼容变更时这里红，是想要的结果，不是噪音。
      - name: checkout mstore
        uses: actions/checkout@v4
        with:
          repository: migoric/mstore
          path: mstore

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: 造演示库
        working-directory: mstore
        run: node bench/demo.ts --out /tmp/demo.db --biz 3000 --cap 200 --runs 4

      - name: 协议契约
        working-directory: mstore-db
        run: node tools/protocol-check.mjs ../mstore/cli.ts /tmp/demo.db
